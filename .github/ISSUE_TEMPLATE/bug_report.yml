name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: "See the generator meta tag at the top of index.html, or the VERSION file."
      placeholder: "3.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and operating system
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
