name: Incoming update

# Drop ONE .zip of the whole project into incoming/ and push (or upload it from the GitHub web UI / phone).
# The archive is unpacked safely, verified (tests + build check), then it REPLACES the project files.
# Never touched: .git, .github, incoming. Afterwards a tag v<VERSION> is created and a GitHub Release is published.

on:
  push:
    branches: [main]
    paths:
      - "incoming/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incoming-update
  cancel-in-progress: false

jobs:
  update:
    name: Verify archive and update project
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Locate the archive
        id: find
        run: |
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "Nothing to do: no .zip in incoming/"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::Put exactly ONE .zip in incoming/ (found ${#zips[@]})."
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Unpack safely
        id: extract
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail
          root="$(python3 .github/scripts/safe_extract.py "$ZIP" "$RUNNER_TEMP/staging")"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          version="$(tr -d '[:space:]' < "$root/VERSION")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION file contains '$version' - expected something like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.find.outputs.found == 'true'
        with:
          node-version: "22"

      - name: Verification build (tests + index.html up to date)
        if: steps.find.outputs.found == 'true'
        working-directory: ${{ steps.extract.outputs.root }}
        run: |
          npm test
          npm run check

      - name: Replace project files
        if: steps.find.outputs.found == 'true'
        env:
          ROOT: ${{ steps.extract.outputs.root }}
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail
          # 1. delete every tracked file except the protected folders
          git ls-files -z | { grep -zvE '^(\.github/|incoming/)' || true; } | xargs -0 -r git rm -q -f --
          # 2. copy the verified project in (the archive can never carry .git, .github or incoming)
          cp -a "$ROOT"/. ./
          # 3. consume the archive
          rm -f "$ZIP"
          mkdir -p incoming && touch incoming/.gitkeep

      - name: Commit, tag and push
        id: commit
        if: steps.find.outputs.found == 'true'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The archive contains no changes."
            exit 0
          fi
          git commit -q -m "chore: update project to v${VERSION} from incoming archive"
          git push origin "HEAD:${BRANCH}"
          sha="$(git rev-parse HEAD)"
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::warning title=Tag already exists::${tag} already exists - bump VERSION to publish a new release."
            exit 0
          fi
          # Create the tag through the API: unlike `git push`, it explains why a tag is refused (rulesets, permissions...).
          for attempt in 1 2 3; do
            if response="$(gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${sha}" 2>&1)"; then
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "Created tag ${tag} at ${sha}"
              exit 0
            fi
            echo "Attempt ${attempt} failed: ${response}"
            sleep $((attempt * 3))
          done
          echo "::error title=Could not create tag ${tag}::${response//$'\n'/ } -- The new commit ${sha} is already on ${BRANCH}. Fix the cause above, then run Actions > Release with tag ${VERSION} and create_tag enabled."
          exit 1

  release:
    name: Publish release
    needs: update
    if: needs.update.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}

  pages:
    name: Publish GitHub Pages
    needs: update
    if: needs.update.outputs.tag != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.tag }}
