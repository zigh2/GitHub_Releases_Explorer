name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: index.html is up to date with src/
        run: npm run check

  e2e:
    name: UI tests (Playwright, headless Chromium)
    runs-on: ubuntu-24.04   # pinned: Playwright's browser dependencies are validated on this image
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: python -m pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end tests against the built index.html
        run: python tests/e2e/run.py
