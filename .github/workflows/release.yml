name: Release

# Publishes index.html as a GitHub Release asset (a ~75 KB single file - no installer, no runtime).
# Trigger: push a tag such as v3.1.2, run manually (tag with or without the leading "v"), or let "Incoming update" call it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v3.1.2 (the leading v is optional)"
        required: true
        type: string
      create_tag:
        description: "Create the tag from the selected branch if it does not exist yet"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
          CREATE_TAG: ${{ inputs.create_tag && 'true' || 'false' }}
        run: |
          set -euo pipefail
          raw="${RAW_TAG#refs/tags/}"
          tag="v${raw#v}"
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "Tag ${tag} found."
          elif [ "${CREATE_TAG}" = "true" ]; then
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" --silent
            echo "::notice title=Tag created::${tag} now points at ${GITHUB_SHA}"
          else
            existing="$(gh api "repos/${GH_REPO}/tags" --jq '.[].name' | head -5 | paste -sd ' ' - || true)"
            echo "::error title=Tag not found::'${tag}' does not exist in ${GH_REPO}. Existing tags: ${existing:-none}. Re-run with create_tag enabled to create it from the selected branch."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: VERSION must match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${file_version}" != "${TAG}" ]; then
            echo "::error title=Version mismatch::The tag is ${TAG} but VERSION contains ${file_version}. Bump VERSION (and package.json), rebuild, and tag again."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          asset="GitHubReleasesExplorer-${TAG#v}.html"
          cp index.html "$asset"
          sha256sum "$asset" > "$asset.sha256"
          ls -l "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --title "GitHub Releases Explorer $TAG" --generate-notes --verify-tag
          fi
