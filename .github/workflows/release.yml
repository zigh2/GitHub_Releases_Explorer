name: Release

# Publishes index.html as a GitHub Release asset (a ~75 KB (23 KB gzipped) single file - no installer, no runtime).
# Trigger: push a tag such as v3.0.0, run manually, or let "Incoming update" call it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v3.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check
      - name: Package
        run: |
          version="${TAG#v}"
          asset="GitHubReleasesExplorer-${version}.html"
          cp index.html "$asset"
          sha256sum "$asset" > "$asset.sha256"
          ls -l "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --title "GitHub Releases Explorer $TAG" --generate-notes
          fi
